<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jui Electronics & Mobile Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; transition: 0.3s; }
        .marquee-container { color: white; padding: 10px 0; overflow: hidden; height: 45px; display: flex; align-items: center; }
        .marquee-text { display: inline-block; white-space: nowrap; animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .slide { display: none; width: 100%; height: 250px; object-fit: cover; border-radius: 20px; }
        .active-slide { display: block; animation: fade 0.8s; }
        @keyframes fade { from {opacity: 0.4} to {opacity: 1} }
        :root { --main-color: #2563eb; }
        .bg-main { background-color: var(--main-color); }
        .text-main { color: var(--main-color); }
        .border-main { border-color: var(--main-color); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="auth-guard" class="fixed inset-0 bg-white z-[1000] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl border">
            <h2 class="text-2xl font-bold text-center text-main mb-6">জুই ইলেকট্রনিক্স লগইন</h2>
            <div class="flex mb-6 bg-slate-100 rounded-xl p-1">
                <button onclick="toggleAuthMode('login')" id="btn-login-tab" class="flex-1 py-2 rounded-lg font-bold bg-white shadow-sm">লগইন</button>
                <button onclick="toggleAuthMode('signup')" id="btn-signup-tab" class="flex-1 py-2 rounded-lg font-bold">সাইন-আপ</button>
            </div>
            <div class="space-y-4">
                <input id="auth-user" type="text" placeholder="ইউজার নাম" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                <input id="auth-pass" type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                <button onclick="handleAuth()" id="auth-submit-btn" class="w-full bg-main text-white p-4 rounded-2xl font-bold shadow-lg">লগইন করুন</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <div id="headline-bg" class="bg-main marquee-container shadow-md">
            <div class="marquee-text font-bold" id="headline-view">জুই ইলেকট্রনিক্স এন্ড মোবাইল স্টোর-এ আপনাকে স্বাগতম!</div>
        </div>

        <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm border-b px-4 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold text-main">জুই ইলেকট্রনিক্স</h1>
                <div class="flex items-center gap-3">
                    <button onclick="showModal('admin-modal')" class="bg-slate-100 p-2 rounded-xl text-slate-600"><i class="fa-solid fa-user-gear"></i></button>
                    <button onclick="logout()" class="text-red-500 text-xl"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-4">
            <div id="slider-box" class="relative mb-8 shadow-xl rounded-[2rem] overflow-hidden border-4 border-white min-h-[150px] bg-slate-200 flex items-center justify-center">
                <p class="text-slate-400">স্লাইডার লোড হচ্ছে...</p>
            </div>

            <div id="admin-panel" class="hidden bg-white p-6 rounded-[2rem] shadow-2xl border mb-10 border-blue-100">
                <h2 class="font-bold mb-4 text-slate-700">🛠 অ্যাডমিন ড্যাশবোর্ড</h2>
                <div class="flex gap-4 overflow-x-auto mb-6 no-scrollbar border-b">
                    <button onclick="switchTab('p')" id="t-p" class="pb-2 font-bold text-main border-b-4 border-main">পণ্য যোগ</button>
                    <button onclick="switchTab('l')" id="t-l" class="pb-2 font-bold text-slate-400">পণ্য তালিকা</button>
                    <button onclick="switchTab('s')" id="t-s" class="pb-2 font-bold text-slate-400">স্লাইডার/থিম</button>
                    <button onclick="switchTab('o')" id="t-o" class="pb-2 font-bold text-slate-400">অর্ডার</button>
                </div>

                <div id="sec-p" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="hidden" id="edit-product-id">
                    <input id="pName" type="text" placeholder="পণ্যের নাম" class="p-3 bg-slate-50 rounded-xl border">
                    <input id="pPrice" type="number" placeholder="দাম" class="p-3 bg-slate-50 rounded-xl border">
                    <input id="pStock" type="number" placeholder="স্টক সংখ্যা" class="p-3 bg-slate-50 rounded-xl border">
                    <input id="pCat" type="text" placeholder="ক্যাটাগরি" class="p-3 bg-slate-50 rounded-xl border">
                    <input id="pImg" type="text" placeholder="ছবির লিঙ্ক" class="p-3 bg-slate-50 rounded-xl border">
                    <button onclick="saveProduct()" id="btn-p-save" class="bg-main text-white p-3 rounded-xl font-bold">সেভ করুন</button>
                </div>

                <div id="sec-l" class="hidden overflow-x-auto">
                    <table class="w-full text-left text-sm"><tbody id="manage-product-rows"></tbody></table>
                </div>

                <div id="sec-s" class="hidden space-y-4">
                    <input id="s1" type="text" placeholder="স্লাইডার ১ লিঙ্ক" class="w-full p-3 border rounded-xl">
                    <input id="s2" type="text" placeholder="স্লাইডার ২ লিঙ্ক" class="w-full p-3 border rounded-xl">
                    <button onclick="saveSliders()" class="bg-main text-white px-6 py-2 rounded-xl font-bold">স্লাইডার আপডেট</button>
                    <hr>
                    <input id="new-h" type="text" placeholder="নতুন হেডলাইন..." class="w-full p-3 border rounded-xl">
                    <button onclick="saveHeadline()" class="bg-orange-500 text-white px-6 py-2 rounded-xl font-bold">হেডলাইন আপডেট</button>
                    <div class="flex gap-4 pt-2">
                        <button onclick="setTheme('blue')" class="w-10 h-10 rounded-full bg-blue-600"></button>
                        <button onclick="setTheme('red')" class="w-10 h-10 rounded-full bg-red-600"></button>
                        <button onclick="setTheme('green')" class="w-10 h-10 rounded-full bg-green-600"></button>
                    </div>
                </div>

                <div id="sec-o" class="hidden overflow-x-auto">
                    <table class="w-full text-left text-sm"><tbody id="order-rows"></tbody></table>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>
    </div>

    <div id="admin-modal" class="fixed inset-0 bg-black/60 hidden z-[1100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm">
            <input id="a-pass" type="password" class="w-full p-4 border rounded-2xl mb-4 text-center" placeholder="অ্যাডমিন পাসওয়ার্ড">
            <button onclick="adminAuth()" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold">লগইন</button>
            <button onclick="hideModal('admin-modal')" class="w-full mt-2 text-slate-400 text-sm">বন্ধ</button>
        </div>
    </div>

    <div id="order-modal" class="fixed inset-0 bg-black/60 hidden z-[1100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm">
            <p id="o-item" class="font-bold text-main mb-4"></p>
            <input id="o-phone" type="number" placeholder="মোবাইল নম্বর" class="w-full p-4 border rounded-2xl mb-4">
            <button onclick="confirmOrder()" class="w-full bg-main text-white p-4 rounded-2xl font-bold">অর্ডার সম্পন্ন</button>
            <button onclick="hideModal('order-modal')" class="w-full mt-2 text-slate-400 text-sm">বাতিল</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAyn1enji_7S3_BYVplgyep8PQjif4NUuQ",
            authDomain: "jui-electronics.firebaseapp.com",
            databaseURL: "https://jui-electronics-default-rtdb.firebaseio.com",
            projectId: "jui-electronics",
            storageBucket: "jui-electronics.firebasestorage.app",
            messagingSenderId: "747927385339",
            appId: "1:747927385339:web:7b90dbf0ce92d68472ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let loggedUser = localStorage.getItem('jui_logged_user');
        const MY_WHATSAPP = "8801326128565";
        const ADMIN_SECRET = "1357";

        // Auth
        function toggleAuthMode(mode) {
            authMode = mode;
            document.getElementById('btn-login-tab').className = mode === 'login' ? 'flex-1 py-2 rounded-lg font-bold bg-white shadow-sm' : 'flex-1 py-2 rounded-lg font-bold';
            document.getElementById('btn-signup-tab').className = mode === 'signup' ? 'flex-1 py-2 rounded-lg font-bold bg-white shadow-sm' : 'flex-1 py-2 rounded-lg font-bold';
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'লগইন করুন' : 'সাইন-আপ করুন';
        }
        function handleAuth() {
            const u = document.getElementById('auth-user').value.trim();
            const p = document.getElementById('auth-pass').value.trim();
            if(!u || !p) return;
            db.ref('users/' + u).once('value', (s) => {
                const d = s.val();
                if(d && d.p === p) { localStorage.setItem('jui_logged_user', u); location.reload(); }
                else alert("ভুল তথ্য!");
            });
        }
        function logout() { localStorage.removeItem('jui_logged_user'); location.reload(); }

        // Admin
        function adminAuth() {
            if(document.getElementById('a-pass').value === ADMIN_SECRET) {
                document.getElementById('admin-panel').classList.remove('hidden');
                hideModal('admin-modal');
            } else alert("ভুল পাসওয়ার্ড!");
        }

        // Realtime Settings (Slider, Theme, Headline)
        db.ref('settings').on('value', (snap) => {
            const data = snap.val();
            if(!data) return;
            if(data.theme) document.documentElement.style.setProperty('--main-color', data.theme==='red'?'#dc2626':data.theme==='green'?'#16a34a':'#2563eb');
            if(data.headline) document.getElementById('headline-view').innerText = data.headline;
            if(data.sliders) {
                const sBox = document.getElementById('slider-box');
                sBox.innerHTML = data.sliders.map(s => `<img class="slide" src="${s}">`).join('');
                startSlider();
            }
        });

        // Save Functions
        function saveSliders() {
            const s = [document.getElementById('s1').value, document.getElementById('s2').value];
            db.ref('settings/sliders').set(s).then(() => alert("স্লাইডার আপডেট!"));
        }
        function saveHeadline() {
            db.ref('settings/headline').set(document.getElementById('new-h').value).then(() => alert("হেডলাইন আপডেট!"));
        }
        function setTheme(t) { db.ref('settings/theme').set(t); }

        function saveProduct() {
            const id = document.getElementById('edit-product-id').value;
            const p = {
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                stock: parseInt(document.getElementById('pStock').value) || 0,
                cat: document.getElementById('pCat').value || 'অন্যান্য',
                img: document.getElementById('pImg').value || 'https://via.placeholder.com/300'
            };
            if(id) db.ref('products/' + id).set(p).then(() => { alert("আপডেট!"); clearP(); });
            else db.ref('products').push(p).then(() => { alert("সেভ!"); clearP(); });
        }
        function clearP() { document.getElementById('edit-product-id').value = ''; document.getElementById('sec-p').querySelectorAll('input').forEach(i => i.value = ''); }

        // UI Products
        db.ref('products').on('value', (snap) => {
            const data = snap.val();
            const grid = document.getElementById('product-grid');
            const manage = document.getElementById('manage-product-rows');
            grid.innerHTML = ''; manage.innerHTML = '';
            if(!data) return;
            Object.keys(data).forEach(key => {
                const p = data[key];
                const out = p.stock <= 0;
                grid.innerHTML += `
                    <div class="bg-white rounded-3xl border p-3 ${out ? 'opacity-50' : ''}">
                        <img src="${p.img}" class="w-full h-32 object-cover rounded-2xl mb-2">
                        <h4 class="font-bold text-xs truncate">${p.name}</h4>
                        <p class="text-main font-bold text-sm">${p.price} ৳</p>
                        <button onclick="${out ? '' : `startOrder('${key}','${p.name}')`}" class="w-full mt-2 ${out ? 'bg-gray-400' : 'bg-main'} text-white py-2 rounded-xl text-[10px] font-bold">${out ? 'স্টক নেই' : 'অর্ডার'}</button>
                    </div>`;
                manage.innerHTML += `<tr class="border-b"><td class="p-2 font-bold">${p.name}</td><td class="p-2 flex gap-2"><button onclick="editProduct('${key}','${p.name}','${p.price}','${p.stock}','${p.cat}','${p.img}')" class="text-blue-500">এডিট</button><button onclick="db.ref('products/${key}').remove()" class="text-red-500">মুছুন</button></td></tr>`;
            });
        });

        function editProduct(id, n, p, s, c, i) {
            document.getElementById('edit-product-id').value = id;
            document.getElementById('pName').value = n; document.getElementById('pPrice').value = p;
            document.getElementById('pStock').value = s; document.getElementById('pCat').value = c;
            document.getElementById('pImg').value = i; switchTab('p');
        }

        function startSlider() {
            let idx = 0;
            setInterval(() => {
                const s = document.getElementsByClassName("slide");
                if(!s.length) return;
                for(let i=0; i<s.length; i++) s[i].classList.remove("active-slide");
                idx++; if(idx > s.length) idx = 1;
                s[idx-1].classList.add("active-slide");
            }, 3000);
        }

        function startOrder(id, n) { selIdx = id; document.getElementById('o-item').innerText = n; showModal('order-modal'); }
        function confirmOrder() {
            const ph = document.getElementById('o-phone').value;
            if(!ph) return;
            window.open(`https://wa.me/${MY_WHATSAPP}?text=${encodeURIComponent(document.getElementById('o-item').innerText + "\nমোবাইল: " + ph)}`);
            hideModal('order-modal');
        }
        function switchTab(t) {
            ['p','l','s','o'].forEach(id => {
                document.getElementById('sec-'+id).classList.add('hidden');
                document.getElementById('t-'+id).className = 'pb-2 font-bold text-slate-400';
            });
            document.getElementById('sec-'+t).classList.remove('hidden');
            document.getElementById('t-'+t).className = 'pb-2 font-bold text-main border-b-4 border-main';
        }
        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
        window.onload = () => { if(loggedUser) { document.getElementById('auth-guard').classList.add('hidden'); document.getElementById('app-content').classList.remove('hidden'); } };
    </script>
</body>
</html>
